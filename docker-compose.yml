services:
  dosekeep:
    build: ./backend
    container_name: dosekeep
    restart: unless-stopped
    environment:
      DOSEKEEP_DATABASE_URL: ${DOSEKEEP_DATABASE_URL:-sqlite:////data/dosekeep.db}
      DOSEKEEP_ALLOWED_ORIGINS: ${DOSEKEEP_ALLOWED_ORIGINS:-http://localhost:8080}
      DOSEKEEP_MEDIKEEP_URL: ${DOSEKEEP_MEDIKEEP_URL:-}
      DOSEKEEP_MEDIKEEP_TOKEN: ${DOSEKEEP_MEDIKEEP_TOKEN:-}
      DOSEKEEP_MEDIKEEP_USERNAME: ${DOSEKEEP_MEDIKEEP_USERNAME:-}
      DOSEKEEP_MEDIKEEP_PASSWORD: ${DOSEKEEP_MEDIKEEP_PASSWORD:-}
      DOSEKEEP_MEDIKEEP_PATIENT_ID: ${DOSEKEEP_MEDIKEEP_PATIENT_ID:-1}
    ports:
      - "${DOSEKEEP_PORT:-8080}:8080"
    volumes:
      - dosekeep-data:/data

volumes:
  dosekeep-data:
