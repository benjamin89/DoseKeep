services:
  dosekeep:
    build: ./backend
    container_name: dosekeep
    restart: unless-stopped
    environment:
      DOSEKEEP_DATABASE_URL: ${DOSEKEEP_DATABASE_URL:-sqlite:////data/dosekeep.db}
      DOSEKEEP_ALLOWED_ORIGINS: ${DOSEKEEP_ALLOWED_ORIGINS:-http://localhost:8080}
      # Each user adds their own optional MediKeep connection after signing in.
      # DOSEKEEP_MASTER_KEY is optional: without it DoseKeep creates an
      # instance key in the persistent Docker volume on first launch.
      DOSEKEEP_MASTER_KEY: ${DOSEKEEP_MASTER_KEY:-}
    ports:
      - "${DOSEKEEP_PORT:-8080}:8080"
    volumes:
      - dosekeep-data:/data

volumes:
  dosekeep-data:
